<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocoMat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4"><div class="container">
  <a class="navbar-brand" href="{{ url_for('web.listar_materiais') }}">LocoMat</a>
  <span class="navbar-text">Atlética Loucomotiva</span>
</div></nav>
<main class="container">
  {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
    <div class="alert {{ 'alert-success' if categoria == 'ok' else 'alert-danger' }}">{{ mensagem }}</div>
  {% endfor %}
  {% block conteudo %}{% endblock %}
</main>
</body>
</html>
