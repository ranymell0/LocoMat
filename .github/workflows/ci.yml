name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências (build)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verificar que o pacote importa
        run: python -c "import locomat; locomat.create_app(':memory:')"
      - name: Executar testes (inclui as regras de dependência)
        run: python -m unittest discover -s tests -v
